<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arcade Satire</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    body{display:grid;place-items:center;color:#fff;font-family:"Courier New",monospace}
    main{position:relative;width:100vw;height:100vh;aspect-ratio:4/3;overflow:hidden;background:#000}
    .screen{position:absolute;inset:0;display:grid;place-items:center;padding:7vmin;text-align:center;opacity:0}
    .screen.active{opacity:1}
    h1{max-width:13ch;margin:0;font-size:clamp(2.4rem,9vw,8rem);line-height:1.05;text-transform:uppercase;letter-spacing:.05em;text-shadow:.05em .05em 0 #f0f}
    .red{color:#ff2b2b;text-shadow:.05em .05em 0 #00e5ff}
    .green{color:#55ff22;text-shadow:.05em .05em 0 #b000ff}
    .amber{color:#ffe600;text-shadow:.05em .05em 0 #ff3bca}
    .monster{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin}
    .monster img{width:min(25vw,220px);max-height:30vh;object-fit:contain;filter:drop-shadow(0 0 14px #45ff1a)}
    .monster h1{font-size:clamp(2rem,7vw,6rem)}
    main::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,.28) 4px);mix-blend-mode:multiply}
  </style>
</head>
<body>
  <main aria-label="Satirical arcade animation">
    <section class="screen active"><h1 class="red">Red Bull causes cancer</h1></section>
    <section class="screen monster"><img src="monster-energy-logo.webp" alt="Monster Energy logo"><h1 class="green">Drink monster energy</h1></section>
    <section class="screen"><h1 class="amber">Bring back the old arcade</h1></section>
  </main>
  <script>
    const screens=[...document.querySelectorAll(".screen")];
    let current=0;
    setInterval(()=>{
      screens[current].classList.remove("active");
      current=(current+1)%screens.length;
      screens[current].classList.add("active");
    },1000);
  </script>
</body>
</html>
